<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результат — Cinema Composer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 24px 0;
            border-bottom: 1px solid #2a2a4a;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #f0c040;
            letter-spacing: 1px;
        }

        .header h1 a {
            color: inherit;
            text-decoration: none;
        }

        .header p {
            margin-top: 6px;
            color: #8888aa;
            font-size: 14px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }

        .section {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #88ff88;
            margin-bottom: 20px;
        }

        .preview-img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .video-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: #f0c040;
        }

        .video-info {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
            border: none;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .btn-download {
            background: linear-gradient(135deg, #f0c040 0%, #e6a820 100%);
            color: #111;
            margin-right: 10px;
        }

        .btn-back {
            background: #2a2a4a;
            color: #ccc;
            border: 1px solid #444;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="/">Cinema Composer</a></h1>
        <p>Результат обработки</p>
    </div>

    <div class="container">
        <div class="section">
            <div class="section-title">Готово!</div>

            {% if is_preview %}
                <img class="preview-img"
                     src="{{ url_for('preview_image', job_id=job_id) }}"
                     alt="Превью">
            {% else %}
                <div class="video-icon">&#9654;</div>
                <div class="video-info">Видео готово к скачиванию</div>
            {% endif %}

            <div class="actions">
                <a class="btn btn-download"
                   href="{{ url_for('download', job_id=job_id, filename=filename) }}">
                    Скачать {{ filename }}
                </a>
                <a class="btn btn-back" href="/">
                    Создать ещё
                </a>
            </div>
        </div>
    </div>
</body>
</html>
